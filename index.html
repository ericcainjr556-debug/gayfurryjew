<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gweg</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: url('https://cdn.discordapp.com/attachments/1478515857222139934/1499641406824775842/IMG_8743.jpg') center/cover no-repeat fixed;
    color: white;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
}

#intro {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
    background: rgba(0,0,0,0.8);
}

.pfp {
    width: 180px;
    border-radius: 50%;
    border: 5px solid #ff2e63;
    box-shadow: 0 0 50px #ff2e63;
    margin-bottom: 20px;
}

.username {
    font-family: 'Orbitron';
    font-size: 42px;
}

.enter-btn {
    margin-top: 40px;
    padding: 16px 70px;
    border: 2px solid #00ffcc;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.enter-btn:hover {
    background: #00ffcc;
    color: black;
    box-shadow: 0 0 30px #00ffcc;
}

#main {
    display: none;
    position: relative;
    z-index: 2;
    padding: 60px;
}

.container {
    display: flex;
    gap: 60px;
    max-width: 1100px;
    margin: auto;
    align-items: center;
}

.left {
    flex: 1;
    display: flex;
    justify-content: center;
}

.main-pfp {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #ff2e63;
    box-shadow: 0 0 40px rgba(255, 0, 100, 0.7);
}

.right {
    flex: 1;
}

.name {
    font-family: 'Orbitron';
    font-size: 50px;
    margin-bottom: 10px;
}

.tag {
    opacity: 0.6;
    margin-bottom: 30px;
}

.bio {
    font-size: 18px;
    line-height: 2;
    margin-bottom: 40px;
}

.buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    padding: 14px 24px;
    border-radius: 10px;
    border: 2px solid #ff2e63;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #ff2e63;
    box-shadow: 0 0 25px #ff2e63;
}

.music {
    border-color: #00ffcc;
}

.music:hover {
    background: #00ffcc;
    color: black;
    box-shadow: 0 0 25px #00ffcc;
}

@media(max-width: 800px) {
    .container {
        flex-direction: column;
        text-align: center;
    }

    .main-pfp {
        width: 170px;
        height: 170px;
    }
}
</style>
</head>

<body>

<div id="intro">
    <img src="https://cdn.discordapp.com/attachments/1499529579751145472/1499567944663957564/f6a76efbada71094c76d0b1c9d99fa73.webp" class="pfp">
    <div class="username">gweg</div>
    <div class="enter-btn" id="enterBtn">enter</div>
</div>

<div id="main">
    <div class="container">

        <div class="left">
            <img src="https://cdn.discordapp.com/attachments/1499529579751145472/1499567944663957564/f6a76efbada71094c76d0b1c9d99fa73.webp" class="main-pfp">
        </div>

        <div class="right">
            <div class="name">gweg</div>
            <div class="tag">@gwegr</div>

            <div class="bio">
                14<br>
                signall &lt;33<br>
                twins - pixiee, dre1mer, jaz, snicks, koda<br>
                <small>bi/femb</small>
            </div>

            <div class="buttons">
                <div class="btn music" id="musicBtn">⏸ Calm Song</div>
            </div>
        </div>

    </div>
</div>

<audio id="audioPlayer" loop></audio>

<script>
const enterBtn = document.getElementById('enterBtn');
const intro = document.getElementById('intro');
const main = document.getElementById('main');
const musicBtn = document.getElementById('musicBtn');
const audio = document.getElementById('audioPlayer');

let isPlaying = true;

audio.src = "https://cdn.discordapp.com/attachments/1499529579751145472/1500186911694913616/10_minute_meditation_music_-_10_minute_relaxing_meditation_music.mp3";

enterBtn.onclick = () => {
    intro.style.display = "none";
    main.style.display = "block";
    audio.play(); // start music after user interaction
};

musicBtn.onclick = () => {
    if (isPlaying) {
        audio.pause();
        musicBtn.innerHTML = "▶ Calm Song";
    } else {
        audio.play();
        musicBtn.innerHTML = "⏸ Calm Song";
    }
    isPlaying = !isPlaying;
};
</script>

</body>
</html>
